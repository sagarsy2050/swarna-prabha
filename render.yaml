# Render blueprint for Swarna Prabha — install-ready.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# Render will prompt you once for the 4 values marked `sync: false` below
# (three seed passwords + the storefront origin). Everything else is automatic:
#
#   build      : npm ci && prisma generate            (API)   /  npm ci && vite build  (web)
#   pre-deploy : prisma migrate deploy  (creates the `vector` extension + schema)
#                then  node prisma/seed.js  (idempotent upserts)
#   start      : node src/server.js
#
# The API is served at https://swarna-prabha-api.onrender.com
# The static build is also published here, but the canonical storefront is
# GitHub Pages (see .github/workflows/deploy.yml + docs/DEPLOYMENT.md).

databases:
  - name: swarna-prabha-db
    databaseName: swarna_prabha
    user: swarna_prabha
    plan: free
    postgresMajorVersion: "16"

services:
  # ── API (Express + Prisma + PostgreSQL) ─────────────────────────────────────
  - type: web
    name: swarna-prabha-api
    runtime: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy && node prisma/seed.js
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: swarna-prabha-db
          property: connectionString

      # Auth — Render generates strong random values, no action needed.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 1h
      - key: JWT_REFRESH_TTL
        value: 30d

      # Storefront origin(s) allowed by CORS. Default is the GitHub Pages site;
      # Render will let you override it at blueprint time (add your own domain,
      # comma-separated, if you have one).
      - key: CORS_ORIGIN
        value: https://sagarsy2050.github.io
        sync: false

      - key: PAYMENT_DRIVER
        value: manual
      - key: MAIL_DRIVER
        value: console
      - key: MAIL_FROM
        value: "Swarna Prabha <no-reply@swarnaprabha.local>"

      # File storage. Render free disks are ephemeral; the classified
      # jewellery-images/ ship in the repo so they always redeploy. Switch to
      # S3/R2 for user uploads by setting STORAGE_DRIVER=s3 and the S3_* vars.
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PUBLIC_UPLOAD_BASE_URL
        value: https://swarna-prabha-api.onrender.com/uploads

      # Seed account passwords — YOU choose these at blueprint time. Emails are
      # fixed (admin@ / jeweller@ / jeweller2@ / customer@swarnaprabha.local).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_JEWELLER_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false

  # ── Web (static React build) — optional; GitHub Pages is the primary host ───
  - type: web
    name: swarna-prabha-web
    runtime: static
    rootDir: client
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://swarna-prabha-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
