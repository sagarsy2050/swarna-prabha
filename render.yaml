# Render blueprint for Swarna Prabha.
# One API service + one static site + one managed PostgreSQL. Not deployed
# automatically — see docs/DEPLOYMENT.md. Adjust `plan`, region, and the
# S3/mail secrets in the Render dashboard before the first deploy.
#
# NOTE: the managed database must have the `vector` extension available. Render's
# Postgres 16 supports `CREATE EXTENSION vector` (run once), which the initial
# migration performs.

databases:
  - name: swarna-prabha-db
    databaseName: swarna_prabha
    user: swarna_prabha
    plan: free
    postgresMajorVersion: "16"

services:
  # ── API (Express + Prisma) ────────────────────────────────────────────────
  - type: web
    name: swarna-prabha-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: swarna-prabha-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 1h
      - key: JWT_REFRESH_TTL
        value: 30d
      # Set to the static site's URL once it exists (see docs/DEPLOYMENT.md).
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_DRIVER
        value: manual
      - key: MAIL_DRIVER
        value: console
      - key: MAIL_FROM
        value: "Swarna Prabha <no-reply@swarnaprabha.local>"
      # File storage: switch to s3 for anything real (Render disks are ephemeral
      # on free/plan restarts). Fill these in the dashboard, then set STORAGE_DRIVER=s3.
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PUBLIC_UPLOAD_BASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_JEWELLER_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false

  # ── Web (static React build) ─────────────────────────────────────────────
  - type: web
    name: swarna-prabha-web
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      # The API service's URL, e.g. https://swarna-prabha-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
