# Render blueprint for Swarna Prabha — install-ready (free tier).
#
# Deploy: Render dashboard → New → Blueprint → connect
#         https://github.com/sagarsy2050/swarna-prabha
# Render prompts once for 3 seed passwords, then everything is automatic:
#
#   build : npm ci && npx prisma generate
#   start : npx prisma migrate deploy   (creates the `vector` extension + schema)
#           && node prisma/seed.js       (idempotent — safe to re-run)
#           && node src/server.js
#
# migrate + seed run at start because the free tier does not allow a
# pre-deploy command; both are idempotent so running them on every boot is fine.
#
# API URL after deploy: https://swarna-prabha-api.onrender.com

databases:
  - name: swarna-prabha-db
    databaseName: swarna_prabha
    user: swarna_prabha
    plan: free
    postgresMajorVersion: "16"

services:
  # ── API (Express + Prisma + PostgreSQL) ─────────────────────────────────────
  - type: web
    name: swarna-prabha-api
    runtime: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate
    # migrate must succeed; seed is best-effort (idempotent); then start.
    startCommand: npx prisma migrate deploy && (node prisma/seed.js || true) && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: swarna-prabha-db
          property: connectionString

      # Auth — Render generates strong random values; no action needed.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 1h
      - key: JWT_REFRESH_TTL
        value: 30d

      # Storefront origin allowed by CORS. Fixed to the GitHub Pages site — edit
      # in the Render dashboard afterwards if you add a custom domain
      # (comma-separated).
      - key: CORS_ORIGIN
        value: https://sagarsy2050.github.io

      - key: PAYMENT_DRIVER
        value: manual
      - key: MAIL_DRIVER
        value: console
      - key: MAIL_FROM
        value: "Swarna Prabha <no-reply@swarnaprabha.local>"

      # File storage. Render free disks are ephemeral; the classified
      # jewellery-images/ ship in the repo so they always redeploy. For user
      # uploads set STORAGE_DRIVER=s3 and the S3_* vars in the dashboard.
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PUBLIC_UPLOAD_BASE_URL
        value: https://swarna-prabha-api.onrender.com/uploads

      # Seed account passwords — YOU choose these at blueprint time. Emails are
      # fixed: admin@ / jeweller@ / jeweller2@ / customer@swarnaprabha.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_JEWELLER_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false

  # ── Web (static React build) — optional; GitHub Pages is the primary host ───
  - type: web
    name: swarna-prabha-web
    runtime: static
    rootDir: client
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://swarna-prabha-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
