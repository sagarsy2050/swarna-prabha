name: Deploy static storefront to GitHub Pages

# Publishes a READ-ONLY storefront to GitHub Pages — no backend.
#
# The workflow spins up Postgres, runs the real migrate + seed, exports the
# whole catalogue (categories, products, shops) to client/public/data/catalog.json,
# then builds the SPA in static mode (VITE_STATIC=true) so it reads that file
# instead of calling an API. jewellery-images/ is copied into the site.
#
# Browsing, categories, filters, search, product pages and shop pages work.
# Accounts, cart, checkout, appointments and the dashboards show a "run locally"
# notice — they need the Express API (see the repo README / docs/DEPLOYMENT.md).

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'jewellery-images/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
      # None of these are real credentials — this DB and API exist only for the
      # duration of the build, to produce catalog.json. The static site has no
      # login. The seed script and the config validator require them to be set.
      JWT_ACCESS_SECRET: build-only-not-a-secret
      JWT_REFRESH_SECRET: build-only-not-a-secret
      SEED_ADMIN_PASSWORD: build-only
      SEED_JEWELLER_PASSWORD: build-only
      SEED_CUSTOMER_PASSWORD: build-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Migrate + seed a throwaway database
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js

      - name: Start the API and export the catalogue
        run: |
          node server/src/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break || sleep 1; done
          node server/scripts/export-catalog.mjs
          kill %1 || true

      - name: Build the static storefront
        env:
          VITE_STATIC: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm --prefix client run build
          cp -r jewellery-images client/dist/jewellery-images
          cp client/dist/index.html client/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
